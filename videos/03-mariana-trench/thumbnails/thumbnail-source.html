<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#000}
  #c{width:1280px;height:720px;position:relative;overflow:hidden;font-family:'Inter','Inter Display',sans-serif}
  .t{position:absolute;font-weight:900;line-height:.9;letter-spacing:-2px;
     color:#FFE14D;-webkit-text-stroke:14px #000;paint-order:stroke fill;text-transform:uppercase}
  .w{color:#fff}
  .pill{position:absolute;background:#E8202A;color:#fff;font-weight:900;border:6px solid #000;
     border-radius:18px;padding:8px 26px;text-transform:uppercase;letter-spacing:-1px}
</style></head>
<body><div id="c"></div>
<script>
const V = new URLSearchParams(location.search).get('v') || 'A';
const c = document.getElementById('c');

// ---------- cartoon face (original art) ----------
function eye(cx, cy, r, mood){
  let s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${mood==='happy'?'#fff':'#FFF4F0'}" stroke="#000" stroke-width="8"/>`;
  if (mood !== 'happy'){
    // blood vessels
    const veins = [[-1,-.2],[-.9,.5],[1,.1],[.85,-.6],[-.4,.95],[.5,.9],[-.6,-.85]];
    veins.forEach(([dx,dy],i)=>{
      const x1=cx+dx*r*.95, y1=cy+dy*r*.95, mx=cx+dx*r*.6+(i%2?8:-8), my=cy+dy*r*.6, x2=cx+dx*r*.38, y2=cy+dy*r*.38;
      s += `<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" stroke="#E0202A" stroke-width="5" fill="none" stroke-linecap="round"/>`;
      s += `<path d="M${mx} ${my} l${dy*18} ${-dx*18}" stroke="#E0202A" stroke-width="3" fill="none" stroke-linecap="round"/>`;
    });
  }
  if (mood === 'spiral'){
    let d = `M${cx} ${cy}`;
    for (let a=0; a<6*Math.PI; a+=0.2){ const rr = a/(6*Math.PI)*r*.72; d += ` L${cx+Math.cos(a)*rr} ${cy+Math.sin(a)*rr}`; }
    s += `<path d="${d}" stroke="#000" stroke-width="7" fill="none" stroke-linecap="round"/>`;
  } else if (mood === 'happy'){
    s += `<circle cx="${cx+6}" cy="${cy+4}" r="${r*.42}" fill="#2B1B10"/><circle cx="${cx+16}" cy="${cy-8}" r="${r*.14}" fill="#fff"/>`;
  } else {
    // tiny shrunken pupil = shock
    s += `<circle cx="${cx}" cy="${cy}" r="${r*.16}" fill="#111"/>`;
  }
  return s;
}
function face(mood, opts={}){
  const skin = mood==='happy' ? '#FFD2A6' : '#F2C7A0';
  let s = `<svg viewBox="0 0 600 640" width="${opts.w||600}" height="${(opts.w||600)*640/600}" xmlns="http://www.w3.org/2000/svg">`;
  // neck + shirt
  s += `<path d="M190 560 Q300 520 410 560 L470 640 L130 640 Z" fill="${mood==='happy'?'#3BA7FF':'#5B4E8C'}" stroke="#000" stroke-width="8"/>`;
  s += `<rect x="255" y="470" width="90" height="90" fill="${skin}" stroke="#000" stroke-width="8"/>`;
  // ears
  s += `<ellipse cx="88" cy="320" rx="40" ry="58" fill="${skin}" stroke="#000" stroke-width="8"/><ellipse cx="512" cy="320" rx="40" ry="58" fill="${skin}" stroke="#000" stroke-width="8"/>`;
  // head
  s += `<ellipse cx="300" cy="300" rx="215" ry="235" fill="${skin}" stroke="#000" stroke-width="9"/>`;
  // hair
  if (mood==='happy'){
    s += `<path d="M92 250 Q110 70 300 62 Q490 70 508 250 Q450 150 300 150 Q160 150 92 250Z" fill="#4A2C17" stroke="#000" stroke-width="8"/>`;
  } else {
    s += `<path d="M86 260 L70 170 L130 190 L120 90 L190 140 L210 40 L265 120 L310 20 L345 115 L410 45 L420 140 L495 95 L475 185 L535 175 L512 262 Q450 160 300 158 Q160 160 86 260Z" fill="#4A2C17" stroke="#000" stroke-width="8" stroke-linejoin="round"/>`;
  }
  // eye bags
  if (mood!=='happy'){
    s += `<path d="M110 360 Q200 440 285 360" stroke="#7A4E8C" stroke-width="14" fill="none" stroke-linecap="round" opacity=".85"/>`;
    s += `<path d="M315 360 Q400 440 490 360" stroke="#7A4E8C" stroke-width="14" fill="none" stroke-linecap="round" opacity=".85"/>`;
    s += `<path d="M125 392 Q200 450 270 392" stroke="#9B6AA8" stroke-width="8" fill="none" stroke-linecap="round" opacity=".6"/>`;
    s += `<path d="M330 392 Q400 450 475 392" stroke="#9B6AA8" stroke-width="8" fill="none" stroke-linecap="round" opacity=".6"/>`;
  }
  // eyes
  const er = mood==='happy' ? 58 : 92;
  s += eye(198, 300, er, mood) + eye(402, 300, er, mood);
  // brows
  if (mood==='happy'){
    s += `<path d="M150 215 Q198 190 246 215" stroke="#000" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M354 215 Q402 190 450 215" stroke="#000" stroke-width="12" fill="none" stroke-linecap="round"/>`;
  } else {
    s += `<path d="M110 190 L260 215" stroke="#000" stroke-width="13" stroke-linecap="round"/><path d="M490 190 L340 215" stroke="#000" stroke-width="13" stroke-linecap="round"/>`;
  }
  // mouth
  if (mood==='happy'){
    s += `<path d="M215 430 Q300 510 385 430 Z" fill="#7A1F1F" stroke="#000" stroke-width="8" stroke-linejoin="round"/><path d="M240 448 Q300 470 360 448" fill="#fff"/>`;
  } else {
    s += `<path d="M200 470 Q225 445 250 470 T300 470 T350 470 T400 470" stroke="#000" stroke-width="10" fill="none" stroke-linecap="round"/>`;
    s += `<path d="M262 478 Q268 510 258 520" stroke="#6FC3FF" stroke-width="9" fill="none" stroke-linecap="round"/>`; // drool
  }
  // sweat drop
  if (mood!=='happy') s += `<path d="M520 200 Q545 245 520 262 Q495 245 520 200Z" fill="#6FC3FF" stroke="#000" stroke-width="5"/>`;
  s += `</svg>`;
  return s;
}
function mug(x,y,sc=1){
  return `<svg style="position:absolute;left:${x}px;top:${y}px" width="${200*sc}" height="${230*sc}" viewBox="0 0 200 230">
   <path d="M60 40 Q50 15 65 0 M100 40 Q90 15 105 0 M140 40 Q130 15 145 0" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"/>
   <path d="M150 90 Q195 95 190 135 Q185 175 145 170" stroke="#000" stroke-width="24" fill="none"/>
   <path d="M150 90 Q195 95 190 135 Q185 175 145 170" stroke="#fff" stroke-width="10" fill="none"/>
   <path d="M30 55 L170 55 L158 215 Q100 230 42 215 Z" fill="#fff" stroke="#000" stroke-width="9" stroke-linejoin="round"/>
   <text x="100" y="160" text-anchor="middle" font-family="Inter" font-weight="900" font-size="58" fill="#E8202A">x12</text></svg>`;
}
function clock(x,y,size,label){
  return `<svg style="position:absolute;left:${x}px;top:${y}px" width="${size}" height="${size}" viewBox="0 0 200 200">
   <circle cx="100" cy="100" r="88" fill="#fff" stroke="#000" stroke-width="12"/>
   ${[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<line x1="${100+Math.cos(a)*70}" y1="${100+Math.sin(a)*70}" x2="${100+Math.cos(a)*80}" y2="${100+Math.sin(a)*80}" stroke="#000" stroke-width="6"/>`}).join('')}
   <line x1="100" y1="100" x2="100" y2="38" stroke="#000" stroke-width="10" stroke-linecap="round"/>
   <line x1="100" y1="100" x2="148" y2="122" stroke="#E8202A" stroke-width="8" stroke-linecap="round"/>
   <circle cx="100" cy="100" r="9" fill="#000"/></svg>`;
}
function arrow(x,y,rot,len=230){
  return `<svg style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${rot}deg);transform-origin:0 50%" width="${len+40}" height="120" viewBox="0 0 ${len+40} 120">
   <path d="M0 60 L${len-50} 60" stroke="#000" stroke-width="40" stroke-linecap="round"/>
   <path d="M${len-80} 10 L${len+20} 60 L${len-80} 110 Z" fill="#000" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
   <path d="M0 60 L${len-50} 60" stroke="#E8202A" stroke-width="24" stroke-linecap="round"/>
   <path d="M${len-70} 26 L${len} 60 L${len-70} 94 Z" fill="#E8202A"/></svg>`;
}
const stars = n => [...Array(n)].map(()=>`<div style="position:absolute;left:${Math.random()*1280}px;top:${Math.random()*720}px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:${.3+Math.random()*.5}"></div>`).join('');


// ---------- shared props ----------
function plane(x,y,w,rot=0,flip=false){
  return `<svg style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${rot}deg) ${flip?'scaleX(-1)':''}" width="${w}" height="${w*0.42}" viewBox="0 0 500 210">
   <path d="M330 95 L250 10 L215 10 L255 95 Z" fill="#D9E2EC" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
   <path d="M60 60 L30 10 L75 10 L120 70 Z" fill="#E8202A" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
   <path d="M40 75 Q40 60 70 60 L420 60 Q490 60 495 95 Q490 130 420 130 L70 130 Q40 130 40 115 Z" fill="#fff" stroke="#000" stroke-width="8"/>
   <path d="M455 72 Q480 78 485 95 L450 95 Z" fill="#2A3B55"/>
   ${[...Array(9)].map((_,i)=>`<circle cx="${130+i*33}" cy="88" r="9" fill="#2A3B55"/>`).join('')}
   <path d="M90 125 L460 125" stroke="#E8202A" stroke-width="10"/>
   <path d="M330 125 L240 205 L200 205 L250 120 Z" fill="#D9E2EC" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
   <rect x="250" y="140" width="55" height="26" rx="12" fill="#B9C4D0" stroke="#000" stroke-width="6"/></svg>`;
}
function mountains(y,h,col='#5B6F8A'){
  const pk=[[0,.55],[120,.2],[230,.5],[330,.05],[460,.45],[560,.15],[700,.5],[820,0],[950,.4],[1060,.12],[1180,.5],[1280,.3]];
  let d=`M0 ${y+h} `+pk.map(([x,f])=>`L${x} ${y+f*h}`).join(' ')+` L1280 ${y+h} Z`;
  let caps=pk.filter(([,f])=>f<.25).map(([x,f])=>{const ty=y+f*h;return `<path d="M${x} ${ty} L${x-45} ${ty+70} L${x-15} ${ty+55} L${x} ${ty+80} L${x+20} ${ty+55} L${x+50} ${ty+72} Z" fill="#fff"/>`}).join('');
  return `<svg style="position:absolute;left:0;top:0" width="1280" height="720"><path d="${d}" fill="${col}" stroke="#000" stroke-width="8" stroke-linejoin="round"/>${caps}</svg>`;
}
function angler(x,y,w,flip=false){
  return `<svg style="position:absolute;left:${x}px;top:${y}px;overflow:visible;${flip?'transform:scaleX(-1)':''}" width="${w}" height="${w*0.8}" viewBox="0 0 500 400">
   <defs><radialGradient id="g${x}"><stop offset="0" stop-color="#FFFBD0"/><stop offset=".35" stop-color="#9FFFEA" stop-opacity=".9"/><stop offset="1" stop-color="#4FFFE0" stop-opacity="0"/></radialGradient></defs>
   <circle cx="90" cy="70" r="90" fill="url(#g${x})"/>
   <path d="M230 120 Q170 0 90 70" stroke="#2E3440" stroke-width="9" fill="none"/>
   <circle cx="90" cy="70" r="20" fill="#FFFBD0" stroke="#000" stroke-width="5"/>
   <path d="M470 200 L500 120 L500 300 Z" fill="#3B4252" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
   <ellipse cx="300" cy="215" rx="190" ry="140" fill="#3B4252" stroke="#000" stroke-width="8"/>
   <path d="M120 170 Q200 200 300 190 Q220 300 130 290 Q90 230 120 170Z" fill="#1A0A0A" stroke="#000" stroke-width="7"/>
   ${[0,1,2,3,4,5].map(i=>`<path d="M${135+i*28} ${178+i*3} l12 ${38-i*2} l12 ${-36+i*2}Z" fill="#fff" stroke="#000" stroke-width="3"/>`).join('')}
   ${[0,1,2,3,4].map(i=>`<path d="M${150+i*28} ${284-i*4} l12 -34 l12 32Z" fill="#fff" stroke="#000" stroke-width="3"/>`).join('')}
   <circle cx="270" cy="140" r="34" fill="#fff" stroke="#000" stroke-width="6"/><circle cx="262" cy="140" r="12" fill="#000"/>
   <path d="M330 300 L360 370 L400 300" fill="#3B4252" stroke="#000" stroke-width="6"/></svg>`;
}
function bubble(x,y,size,inner){
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-radius:50%;border:8px solid #000;
    background:radial-gradient(circle at 30% 25%, rgba(255,255,255,.55), rgba(180,230,255,.18) 40%, rgba(120,200,255,.12));overflow:hidden">
    <div style="position:absolute;left:50%;top:52%;transform:translate(-50%,-50%)">${inner}</div>
    <div style="position:absolute;left:18%;top:12%;width:22%;height:12%;border-radius:50%;background:rgba(255,255,255,.7);transform:rotate(-30deg)"></div></div>`;
}
function depth(x,y,h,marks){
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:14px;height:${h}px;background:#fff;border:5px solid #000;border-radius:8px"></div>`+
   marks.map(([f,l])=>`<div style="position:absolute;left:${x+28}px;top:${y+f*h-18}px;font:900 30px Inter;color:#fff;-webkit-text-stroke:6px #000;paint-order:stroke fill">— ${l}</div>`).join('');
}
const bubblesFx = n => [...Array(n)].map(()=>{const s=8+Math.random()*22;return `<div style="position:absolute;left:${Math.random()*1280}px;top:${Math.random()*720}px;width:${s}px;height:${s}px;border-radius:50%;border:3px solid rgba(255,255,255,.35)"></div>`}).join('');

let html='';
// ===== TIBET =====
if (V==='T1'){
  c.style.background='linear-gradient(#4FB3FF,#BEE6FF)';
  html+=mountains(330,390,'#6B7F99');
  html+=plane(330,150,620,-4);
  // red NO sign over plane
  html+=`<div style="position:absolute;left:470px;top:60px;width:340px;height:340px;border-radius:50%;border:34px solid #E8202A;box-shadow:0 0 0 7px #000, inset 0 0 0 7px #000"></div>
         <div style="position:absolute;left:620px;top:50px;width:34px;height:360px;background:#E8202A;transform:rotate(45deg);outline:7px solid #000"></div>`;
  html+=`<div class="t" style="left:40px;top:40px;font-size:120px;transform:rotate(-4deg)">WHY?!</div>`;
  html+=`<div class="pill" style="right:40px;top:560px;font-size:70px;transform:rotate(-2deg)">TIBET</div>`;
}
if (V==='T2'){
  c.style.background='#1C2A44';
  // window frame with mountains outside
  html+=`<div style="position:absolute;left:660px;top:60px;width:540px;height:600px;border-radius:200px;border:26px solid #E4E8EE;outline:8px solid #000;overflow:hidden;background:linear-gradient(#5FB8FF,#CFEFFF)">
     <div style="position:absolute;left:-380px;top:-60px;transform:scale(1)">${mountains(260,420,'#6B7F99')}</div></div>`;
  html+=`<div style="position:absolute;left:-30px;top:120px">${face('wrecked',{w:620})}</div>`;
  // oxygen mask
  html+=`<svg style="position:absolute;left:150px;top:150px;overflow:visible" width="260" height="560" viewBox="0 0 260 560">
     <path d="M130 -200 L130 420" stroke="#9AA" stroke-width="6"/>
     <path d="M70 420 Q130 380 190 420 L180 500 Q130 530 80 500 Z" fill="#FFE14D" stroke="#000" stroke-width="8"/></svg>`;
  html+=`<div class="t" style="left:600px;top:200px;font-size:170px;transform:rotate(-5deg)">12 MIN</div>`;
  html+=`<div class="pill" style="left:650px;top:420px;font-size:56px;transform:rotate(-3deg)">TO SURVIVE?</div>`;
}
if (V==='T3'){
  c.style.background='#7EC8E3';
  // map land
  html+=`<svg style="position:absolute;left:0;top:0" width="1280" height="720"><path d="M0 120 Q200 80 380 150 Q600 90 820 160 Q1050 110 1280 180 L1280 720 L0 720Z" fill="#F2E3B3" stroke="#000" stroke-width="8"/>
    <path d="M300 330 Q420 230 620 260 Q820 230 920 330 Q960 460 800 520 Q600 580 420 520 Q260 470 300 330Z" fill="#B85C38" stroke="#000" stroke-width="8"/>
    <path d="M60 640 Q300 700 640 640 Q980 590 1240 650" stroke="#000" stroke-width="10" fill="none" stroke-dasharray="26 18"/>
    <path d="M60 300 Q160 120 640 170 Q1100 120 1220 300" stroke="#000" stroke-width="10" fill="none" stroke-dasharray="26 18"/></svg>`;
  html+=plane(1020,560,190,-8);
  html+=plane(1020,200,190,12);
  html+=`<div class="t w" style="left:430px;top:330px;font-size:110px">TIBET</div>`;
  html+=`<div class="t" style="left:40px;top:28px;font-size:96px;transform:rotate(-2deg)">PLANES AVOID IT</div>`;
  html+=`<svg style="position:absolute;left:880px;top:300px" width="150" height="150" viewBox="0 0 150 150"><path d="M20 20 L130 130 M130 20 L20 130" stroke="#000" stroke-width="44" stroke-linecap="round"/><path d="M20 20 L130 130 M130 20 L20 130" stroke="#E8202A" stroke-width="26" stroke-linecap="round"/></svg>`;
}
// ===== MARIANA =====
const sea='linear-gradient(#1C9BE0 0%, #0B4F8A 25%, #062A55 50%, #020B1C 80%, #000 100%)';
if (V==='M1'){
  c.style.background=sea; html+=bubblesFx(30);
  html+=depth(40,40,640,[[0,'0 m'],[.3,'1,000 m'],[.62,'6,000 m'],[.97,'11,000 m']]);
  html+=angler(560,230,560);
  html+=bubble(300,380,260,face('wrecked',{w:200}));
  html+=`<div class="t" style="left:300px;top:40px;font-size:150px;transform:rotate(-3deg)">11 KM DOWN</div>`;
}
if (V==='M2'){
  c.style.background='linear-gradient(#5FC1FF 0 18%, #0B4F8A 18%, #02122B 100%)';
  html+=`<svg style="position:absolute;left:0;top:0" width="1280" height="720">
    <path d="M0 130 L400 130 Q440 130 445 200 L470 690 L810 690 L835 200 Q840 130 880 130 L1280 130 L1280 720 L0 720Z" fill="#3A2A1E" stroke="#000" stroke-width="8"/>
    <path d="M478 690 L560 470 L590 500 L640 330 L700 480 L730 450 L802 690 Z" fill="#8A9BB0" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
    <path d="M640 330 L612 425 L630 412 L645 435 L662 410 L680 420 Z" fill="#fff" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    <path d="M760 140 L760 322" stroke="#FFE14D" stroke-width="10" stroke-dasharray="18 12"/>
    <path d="M740 140 L780 140 M740 326 L780 326" stroke="#FFE14D" stroke-width="10"/></svg>`;
  html+=`<div class="t w" style="left:40px;top:180px;font-size:118px">EVEREST</div>`;
  html+=`<div class="t" style="left:40px;top:300px;font-size:118px">DROWNS</div>`;
  html+=`<div class="pill" style="left:900px;top:190px;font-size:54px">+2 KM!</div>`;
  html+=`<div class="t w" style="right:30px;top:6px;font-size:84px;-webkit-text-stroke:10px #000">THE TRENCH</div>`;
}
if (V==='M3'){
  c.style.background='radial-gradient(circle at 60% 50%, #0B3A6B, #020B1C 70%)'; html+=bubblesFx(25);
  html+=angler(700,120,620,true);
  html+=bubble(480,150,470,face('wrecked',{w:380}));
  // crack lines on bubble
  html+=`<svg style="position:absolute;left:480px;top:150px" width="470" height="470"><path d="M330 40 L300 120 L340 160 L290 230 M300 120 L250 110" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M330 40 L300 120 L340 160 L290 230 M300 120 L250 110" stroke="#000" stroke-width="2" fill="none"/></svg>`;
  html+=`<div class="t" style="left:30px;top:60px;font-size:170px;transform:rotate(-4deg)">1,000x</div>`;
  html+=`<div class="pill" style="left:40px;top:270px;font-size:58px;transform:rotate(-3deg)">PRESSURE</div>`;
}
c.innerHTML=html;
</script></body></html>
